on gives them nothing to say yes to.\n\n   Watch for this in your own writing. It usually appears when the writer knows what they want to happen but has not decided who is supposed to make it happen.\n\n\n\n> **Carry this into your own brief**\n\n> End with one action, aimed at the person holding the brief, at the stage your issue is actually in, with a date attached and something offered in return. If your last paragraph could be satisfied by your reader nodding, it is not an ask.\n\n---\n\n## Step six, continued: say how you would know it worked\n\n*Why this step matters:*\nThere is one more thing your reader wants, and most briefs do not supply it. If they do what you asked, they are going to be asked later whether it was worth doing. A brief that says how the change could be checked hands them the answer to that question in advance. A brief that does not has asked them to take a risk with nothing to show for it. This is also where you find out whether your recommendation was honest, because a measure that could only ever prove you right is not a measure.\n\n### 1. [write] Write one sentence saying how Bliss would know that joining the compact worked.\n\n*Shows back to student:* Your problem statement, for reference\n*Helper text:*\nGo back to the problem you wrote in step one. Whatever you said was wrong is the thing that should look different afterward.\n*Placeholder text in box:* Bliss would know it worked if...\n*Button:* Save my sentence and continue\n*After they submit:*\nYour sentence is saved.\nNext you will read four versions of the same thing, written by other people. Yours will stay on screen so you can hold it up against them as you read.\n\n### 2. [choice] Which of these is the most useful measure?\n\n*Shows back to student:* Your version, for reference\n*Helper text:*\nThese four were written by other people. Yours is shown above so you can review it alongside them. It is not one of the choices.\n\n- **Option:** Nurses in Bliss will have more flexibility and better access to opportunities.\n\n   Nobody can check this. Flexibility is not counted anywhere, and neither is access to opportunity, so two years from now there is no way to say whether it happened.\n\n   Go back to the problem statement work in step one. The same habit that weakens a problem statement weakens a measure. If the words in it could not appear on a report, they will not settle an argument later.\n\n\n- **Option:** The Bliss Board of Nursing will submit an implementation report to the legislature within 18 months.\n\n   This measures whether the work got done, not whether it worked. A report will arrive on schedule whether the policy helped or not.\n\n   Activity is easy to count, which is exactly why it gets substituted for outcomes. It is worth including as a mechanism, since somebody has to gather the numbers, but do not let it stand in for the result.\n\n\n- **Option:** Two years after implementation, compare the border hospital's vacancy rate and the number of nurses practicing in Bliss on multistate licenses against the board's current endorsement volume and today's three open positions. **(strongest)**\n\n   This is the most useful measure. It names what to look at, what to compare it against, and when.\n\n   The comparison is what makes it work. A number on its own tells you nothing. A number next to the number you started with tells you whether anything changed, and you already have the starting figures, because you gathered them in step one.\n\n   Notice that this measure could come back badly. The vacancy rate might not move. That is what makes it a measure rather than a prediction, and a reader who sees you offer a test you could fail will take the rest of your brief more seriously.\n\n\n- **Option:** More nurses will be able to practice in Bliss.\n\n   This is probably true, and it still does not help.\n\n   More than what, by when, and compared to what would have happened anyway? Nurse counts drift for reasons that have nothing to do with licensure: a new hospital opens, a program graduates a large class, a neighboring state raises wages. Without a baseline and a timeframe, any number that arrives can be read as success by whoever wants to read it that way.\n\n\n\n### 3. [write] Review your sentence and save your final version.\n\n*Shows back to student:* Your original sentence, for reference\n*Helper text:*\nRevise your sentence using what you learned, or keep it if it already includes what to measure, a comparison point, and when to measure it.\n*Placeholder text in box:* Bliss would know it worked if...\n*Button:* Save my final version\n*After they submit:*\nYour final version is saved.\n\n> **Carry this into your own brief**\n\n> Tie your measure to the problem you named at the start, give it a baseline and a date, and make sure it could come back against you. Your reader is deciding whether to spend something on your recommendation. Telling them how they will know it paid off is the last thing that separates a brief from an opinion.\n\n*Closing text on this screen:*\n**One thing worth noticing** The board's funding was an argument against your recommendation in step three and an argument for leaving things alone in step four. The fact never changed. What changed was which side of the question you were standing on, and that is most of what makes policy analysis harder than it looks.\n**A last word** This activity used a bill in a fictional statehouse because legislation is the clearest version of the process. It has visible stages, a written record, and a person whose job is to decide. It is not the most common version.\nMost of the advocacy you do will be closer than that. A protocol on your unit that stopped fitting the work. A staffing pattern your council could take up. A policy your organization wrote years ago and has not looked at since. A position your professional organization could be asked to take. The six steps do not change with the size of the room. Name the problem so someone else can act on it, find who has the authority, understand who is affected and who will object, lay out the real options including leaving things alone, choose one and say why, and ask for something specific.\nHere is why it matters that it is you. Nurses are closest to the place where a policy meets a patient, which means you see the distance between what a policy says and what it does long before anyone who writes policy will. That knowledge does not travel on its own. Somebody has to carry it into the room where the decision gets made, in a form the person making the decision can actually use.\nThat is what a brief is for, and you now know how to build one. The next one is yours.\n\n---\n\n## Summary sheet (final screen)\n\nHeading: Policy brief activity: summary sheet\n**Print this now.** Use your browser's print command and choose Save as PDF. If you close this page and open it somewhere else, this sheet will be empty.\nThe sheet reprints each step title, its one-line subtitle, the student's own writing, the choices they made, and the principle for that step. The step titles, subtitles, and principles are:\n**Step one: state the problem**\n*Subtitle:* Who is affected, by what, and at what scale\n*Principle:* Name who is affected, what is causing it, and how big it is. Keep the solution out of the problem sentence.\n**Step one, continued: back it with evidence**\n*Subtitle:* Different sources do different jobs\n*Principle:* Data from the agency that runs a process is the hardest evidence for a reader to dismiss. Stories help a reader understand the human side and opinion polls show whether a change can move. Neither one establishes that a problem exists.\n**Step two: figure out who has the power to change it**\n*Subtitle:* What controls the problem\n*Principle:* Work out what controls the problem before you decide who to write to. Licensure and scope of practice are state matters, and a brief aimed at the wrong level cannot work however well it is written.\n**Step two, continued: name the person**\n*Subtitle:* Authority is not the same as influence\n*Principle:* Write to the person who controls the step your issue is stuck at. You can write to an ally instead, as long as your ask matches what that ally can deliver.\n**Step three: map who is affected**\n*Subtitle:* Supporters, resisters, and the people nobody asked\n*Principle:* Identify who would support, who would resist, and who is affected but absent. Check your assumptions about the first two, and look hardest at the third.\n**Step three, continued: take the objection seriously**\n*Subtitle:* Concede what is real, then give your reader something to do\n*Principle:* Find out whether an objection is wrong, half right, or sound before you answer it. Concede what is real, add what complicates it, and give your reader something specific to do.\n**Step four: build the option set**\n*Subtitle:* What belongs on the list and what does not\n*Principle:* An option belongs if your reader could actually choose it. Include the status quo every time, include the narrower fixes, and leave off anything that exists only to lose.\n**Step four, continued: weigh the options against the problem**\n*Subtitle:* What each option fixes, and what doing nothing costs\n*Principle:* Compare each option against the problem piece by piece, and name what your own recommendation leaves unfixed. A reader who sees you state your option's limits will believe you about the others.\n**Step five: commit**\n*Subtitle:* What you would recommend, and what defending it requires\n*Principle:* A brief has to recommend something. Choose the one you can defend honestly, knowing what it costs and what it leaves undone.\n**Step five, continued: defend it**\n*Subtitle:* Name the runner-up before your reader does\n*Principle:* Name the runner-up, say what it would accomplish, then say what it leaves undone and what your recommendation costs to reach further. A defense that concedes nothing persuades no one.\n**Step six: make the ask**\n*Subtitle:* One action, aimed at your reader, at the right stage\n*Principle:* End with one action, aimed at the person holding the brief, at the stage your issue is actually in, with a date attached and something offered in return.\n**Step six, continued: say how you would know it worked**\n*Subtitle:* A baseline, a date, and a result that could go against you\n*Principle:* Tie your measure to the problem you named at the start, give it a baseline and a date, and make sure it could come back against you.\n**A last word**\nThis activity used a bill in a fictional statehouse because legislation is the clearest version of the process. It has visible stages, a written record, and a person whose job is to decide. It is not the most common version.\nMost of the advocacy you do will be closer than that. A protocol on your unit that stopped fitting the work. A staffing pattern your council could take up. A policy your organization wrote years ago and has not looked at since. A position your professional organization could be asked to take. The six steps do not change with the size of the room. Name the problem so someone else can act on it, find who has the authority, understand who is affected and who will object, lay out the real options including leaving things alone, choose one and say why, and ask for something specific.\nHere is why it matters that it is you. Nurses are closest to the place where a policy meets a patient, which means you see the distance between what a policy says and what it does long before anyone who writes policy will. That knowledge does not travel on its own. Somebody has to carry it into the room where the decision gets made, in a form the person making the decision can actually use.\nThat is what a brief is for, and you now know how to build one. The next one is yours.\n";
    const STORAGE_KEY = 'policyBriefActivity.v1';
    const DB_NAME = 'policyBriefActivity';
    const DB_STORE = 'savedWork';
    const STEP_WORDS = { one: 1, two: 2, three: 3, four: 4, five: 5, six: 6 };
    const CATEGORIES = ['Would likely support', 'Would likely resist', 'Affected, but not in the room'];

    const safeParse = value => { try { return JSON.parse(value); } catch { return null; } };
    const loadSavedState = () => { try { return safeParse(localStorage.getItem(STORAGE_KEY)); } catch { return null; } };
    const state = Object.assign({ screen: 0, studentName: '', answers: {}, completed: {}, completedAt: 0, savedAt: 0 }, loadSavedState() || {});
    const app = document.getElementById('app');
    const saveStatus = document.getElementById('save-status');
    const progressFill = document.getElementById('progress-fill');
    const restartDialog = document.getElementById('restart-dialog');

    function openStateDatabase() {
      return new Promise((resolve, reject) => {
        if (!('indexedDB' in window)) return reject(new Error('IndexedDB is unavailable.'));
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = () => {
          if (!request.result.objectStoreNames.contains(DB_STORE)) request.result.createObjectStore(DB_STORE);
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function readIndexedState() {
      const database = await openStateDatabase();
      return new Promise((resolve, reject) => {
        const request = database.transaction(DB_STORE, 'readonly').objectStore(DB_STORE).get(STORAGE_KEY);
        request.onsuccess = () => { database.close(); resolve(request.result || null); };
        request.onerror = () => { database.close(); reject(request.error); };
      });
    }

    async function writeIndexedState(snapshot) {
      const database = await openStateDatabase();
      return new Promise((resolve, reject) => {
        const transaction = database.transaction(DB_STORE, 'readwrite');
        transaction.objectStore(DB_STORE).put(snapshot, STORAGE_KEY);
        transaction.oncomplete = () => { database.close(); resolve(); };
        transaction.onerror = () => { database.close(); reject(transaction.error); };
      });
    }

    async function clearIndexedState() {
      const database = await openStateDatabase();
      return new Promise((resolve, reject) => {
        const transaction = database.transaction(DB_STORE, 'readwrite');
        transaction.objectStore(DB_STORE).delete(STORAGE_KEY);
        transaction.oncomplete = () => { database.close(); resolve(); };
        transaction.onerror = () => { database.close(); reject(transaction.error); };
      });
    }

    function savedStatus() {
      if (!state.savedAt) return 'Progress will save on this device';
      const time = new Date(state.savedAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      return `Saved on this device at ${time}`;
    }

    function persist(message = 'Saving…') {
      state.savedAt = Date.now();
      const snapshot = JSON.parse(JSON.stringify(state));
      let localSaved = false;
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot));
        localSaved = true;
        saveStatus.textContent = message;
      } catch {
        saveStatus.textContent = 'Trying another save method…';
      }
      window.clearTimeout(persist.indexedTimer);
      persist.indexedTimer = window.setTimeout(async () => {
        try {
          await writeIndexedState(snapshot);
          saveStatus.textContent = savedStatus();
        } catch {
          saveStatus.textContent = localSaved ? savedStatus() : 'Keep this page open—saving is unavailable';
        }
      }, 100);
    }

    function escapeHtml(value = '') {
      return String(value).replace(/[&<>"']/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;' }[char]));
    }

    function inlineMd(value = '') {
      let text = escapeHtml(value.trim());
      text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
      text = text.replace('Policy Briefs, UNC Writing Center.', '<a href="https://writingcenter.unc.edu/tips-and-tools/policy-briefs/" target="_blank" rel="noopener">Policy Briefs, UNC Writing Center<span class="print-hide"> ↗</span></a>.');
      text = text.replace(/nursecompact\.com/g, '<a href="https://www.nursecompact.com/" target="_blank" rel="noopener">nursecompact.com<span class="print-hide"> ↗</span></a>');
      return text;
    }

    function splitSections(source) {
      const output = [];
      let current = null;
      for (const raw of source.replace(/\r/g, '').split('\n')) {
        const match = raw.match(/^##\s+(.+)$/);
        if (match) {
          if (current) output.push(current);
          current = { title: match[1].trim(), lines: [] };
        } else if (current) current.lines.push(raw);
      }
      if (current) output.push(current);
      return output;
    }

    function slugify(value) {
      return value.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    }

    function parseQuestions(section) {
      const questions = [];
      let current = null;
      const preface = [];
      for (const line of section.lines) {
        const match = line.match(/^###\s+(\d+)\.\s+\[(\w+)\]\s+(.+)$/);
        if (match) {
          if (current) questions.push(current);
          current = { number: match[1], type: match[2], title: match[3].trim(), lines: [] };
        } else if (current) current.lines.push(line);
        else preface.push(line);
      }
      if (current) questions.push(current);
      return { preface, questions };
    }

    const sections = splitSections(ACTIVITY_SOURCE);
    const scenario = sections.find(section => section.title.startsWith('The scenario'));
    const screens = sections.filter(section => /^Step (one|two|three|four|five|six)/i.test(section.title)).map(section => ({
      ...section,
      slug: slugify(section.title),
      parsed: parseQuestions(section),
      step: STEP_WORDS[(section.title.match(/^Step (one|two|three|four|five|six)/i) || [])[1]?.toLowerCase()] || 1
    }));
    const totalQuestionCount = screens.reduce((total, screen) => total + screen.parsed.questions.length, 0);

    function stateTable() {
      return `<table class="status-table"><caption>Jurisdictions outside the Nurse Licensure Compact, grouped by status</caption><tbody>
        <tr><th>No legislation introduced</th><td>Alaska, American Samoa, California, Hawaii, Illinois, Minnesota, Nevada, New York, Northern Mariana Islands, Oregon</td></tr>
        <tr><th>Legislation pending</th><td>District of Columbia, Michigan</td></tr>
        <tr><th>Passed, waiting to take effect</th><td>Massachusetts, Virgin Islands</td></tr>
        <tr><th>Passed, partly in effect</th><td>Guam</td></tr>
      </tbody></table>`;
    }

    function policyStatusBlock() {
      return `<p><strong>Passing a law and putting it in place are not the same thing.</strong> Bliss is fictional, but the Nurse Licensure Compact is real, and the states outside it are not all in the same position. Where a state sits in this sequence changes what there is to ask for.</p>
        ${stateTable()}
        <p>Asking a legislator to introduce a bill is a different request from asking for a vote on a bill that already exists, and both are different from asking an agency to fund a law that already passed. Match your ask to where the issue actually is.</p>
        <p>As you move through your own policy brief, pay attention to where your issue sits in the policy process and make sure your recommendation matches that stage.</p>
        <p><em>Status as of September 2026. Check current membership at <a href="https://www.nursecompact.com/" target="_blank" rel="noopener">nursecompact.com<span class="print-hide"> ↗</span></a> before using this anywhere else.</em></p>`;
    }

    function mdBlocks(lines, className = '') {
      const chunks = [];
      let paragraph = [];
      let list = [];
      let quote = [];
      const flushParagraph = () => {
        if (!paragraph.length) return;
        const joined = paragraph.join(' ').trim();
        if (joined.includes('Jurisdictions outside the Nurse Licensure Compact')) {
          chunks.push(policyStatusBlock());
        } else if (joined) chunks.push(`<p>${inlineMd(joined)}</p>`);
        paragraph = [];
      };
      const flushList = () => {
        if (!list.length) return;
        chunks.push(`<ul>${list.map(item => `<li>${inlineMd(item)}</li>`).join('')}</ul>`);
        list = [];
      };
      const flushQuote = () => {
        if (!quote.length) return;
        const useful = quote.filter(item => item.trim());
        const hasTakeaway = useful[0]?.includes('Carry this into your own brief');
        if (hasTakeaway) useful.shift();
        chunks.push(`<div class="transfer">${hasTakeaway ? '<h4>Important takeaway</h4>' : ''}${useful.map(item => `<p>${inlineMd(item)}</p>`).join('')}</div>`);
        quote = [];
      };
      for (const raw of lines) {
        const line = raw.trim();
        if (!line) { flushParagraph(); flushList(); continue; }
        if (!line.startsWith('>')) flushQuote();
        if (line === '---') continue;
        if (/^\*Closing text on this screen:\*$/.test(line)) { flushParagraph(); flushList(); flushQuote(); chunks.push('<div class="closing-note">'); continue; }
        if (line.startsWith('>')) { flushParagraph(); flushList(); quote.push(line.replace(/^>\s?/, '')); continue; }
        if (/^-\s+/.test(line) && !/^- \*\*/.test(line)) { flushParagraph(); flushQuote(); list.push(line.replace(/^-\s+/, '')); continue; }
        if (/^\*Why this step matters:\*$/.test(line)) continue;
        paragraph.push(line);
      }
      flushParagraph(); flushList(); flushQuote();
      if (chunks.includes('<div class="closing-note">')) chunks.push('</div>');
      return `<div${className ? ` class="${className}"` : ''}>${chunks.join('')}</div>`;
    }

    function directive(lines, label) {
      const marker = `*${label}:*`;
      const index = lines.findIndex(line => line.trim().startsWith(marker));
      if (index < 0) return '';
      const sameLine = lines[index].trim().slice(marker.length).trim();
      if (sameLine) return sameLine;
      const out = [];
      for (let i = index + 1; i < lines.length; i++) {
        const value = lines[i].trim();
        if (!value) continue;
        if (/^\*[^*]+:\*/.test(value) || /^- \*\*/.test(value) || /^>/.test(value)) break;
        out.push(value);
      }
      return out.join(' ');
    }

    function parseItems(lines, type) {
      const patterns = {
        choice: /^- \*\*Option:\*\*\s*(.*)$/,
        sort: /^- \*\*Group \(correct bin: ([^)]+)\):\*\*\s*(.*)$/,
        multi: /^- \*\*Item \((belongs on the list|does not belong)\):\*\*\s*(.*)$/
      };
      const pattern = patterns[type];
      const items = [];
      let current = null;
      for (const raw of lines) {
        const line = raw.trim();
        const match = line.match(pattern);
        if (match) {
          if (current) items.push(current);
          if (type === 'choice') {
            const strongest = /\*\*\(strongest\)\*\*/.test(match[1]);
            current = { label: match[1].replace(/\s*\*\*\(strongest\)\*\*\s*/, '').trim(), strongest, feedback: [] };
          } else if (type === 'sort') current = { correct: match[1], label: match[2], feedback: [] };
          else current = { belongs: match[1] === 'belongs on the list', label: match[2], feedback: [] };
          continue;
        }
        if (!current) continue;
        if (/^>/.test(line) || /^\*Optional (rewrite )?box:\*/.test(line) || /^\*Closing text/.test(line)) {
          items.push(current);
          current = null;
          continue;
        }
        if (line && !/^\*(Helper text|Button|After they submit|Checkboxes|Categories|Shows back to student|Recalls):\*/.test(line)) current.feedback.push(line);
      }
      if (current) items.push(current);
      return items;
    }

    function tailLines(lines) {
      const start = lines.findIndex(line => /^>/.test(line.trim()) || /^\*Closing text on this screen:\*/.test(line.trim()));
      return start < 0 ? [] : lines.slice(start).filter(line => !/^\*Optional (rewrite )?box:\*/.test(line.trim()) && !line.includes('**One thing worth noticing**'));
    }

    function whyText(lines) {
      const index = lines.findIndex(line => line.trim() === '*Why this step matters:*');
      if (index < 0) return '';
      const out = [];
      for (let i = index + 1; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) { if (out.length) break; else continue; }
        if (line.startsWith('###')) break;
        out.push(line);
      }
      return out.join(' ');
    }

    function qid(screen, index) { return `${screen.slug}-q${index + 1}`; }
    function answer(id) { return state.answers[id] || {}; }
    function isDone(id) { return Boolean(state.completed[id]); }
    const FINAL_VERSION_SOURCES = {
      'step-three-continued-take-the-objection-seriously-q4': 'step-three-continued-take-the-objection-seriously-q2',
      'step-four-continued-weigh-the-options-against-the-problem-q4': 'step-four-continued-weigh-the-options-against-the-problem-q2',
      'step-five-continued-defend-it-q3': 'step-five-continued-defend-it-q1',
      'step-six-continued-say-how-you-would-know-it-worked-q3': 'step-six-continued-say-how-you-would-know-it-worked-q1'
    };

    function referenceFor(screen, index, lines) {
      let marker = directive(lines, 'Shows back to student');
      let sourceId = '';
      let text = '';
      if (screen.slug === 'step-one-state-the-problem' && (index === 1 || index === 2)) {
        marker = index === 1 ? 'Your original problem statement, for reference' : 'Your original problem statement';
        sourceId = 'step-one-state-the-problem-q1';
      }
      if (!marker) return '';
      if (screen.slug === 'step-five-commit' && index === 1) {
        sourceId = 'step-five-commit-q1';
        const selected = answer(sourceId).selected;
        const choices = parseItems(screen.parsed.questions[0].lines, 'choice');
        text = Number.isInteger(selected) ? choices[selected]?.label : '';
      }
      if (!sourceId) {
        if (screen.slug === 'step-one-state-the-problem' && /problem statement/i.test(marker)) sourceId = 'step-one-state-the-problem-q1';
        else if (/problem statement/i.test(marker)) sourceId = 'step-one-state-the-problem-q4';
        else if (screen.slug.startsWith('step-three')) sourceId = 'step-three-continued-take-the-objection-seriously-q2';
        else if (screen.slug.startsWith('step-four')) sourceId = 'step-four-continued-weigh-the-options-against-the-problem-q2';
        else if (screen.slug.startsWith('step-five')) sourceId = 'step-five-continued-defend-it-q1';
        else if (screen.slug.startsWith('step-six')) sourceId = 'step-six-continued-say-how-you-would-know-it-worked-q1';
      }
      text = text || answer(sourceId).text || 'You have not entered this response yet.';
      return `<div class="reference-box"><strong>${escapeHtml(marker)}</strong>${escapeHtml(text)}</div>`;
    }

    function recallFor(lines) {
      const marker = directive(lines, 'Recalls');
      if (!marker) return '';
      const objection = 'The Bliss Board of Nursing is funded by its own licensing fees. If nurses shift to multistate licenses and out-of-state nurses stop applying for Bliss licenses, board revenue drops, and the gap gets closed by raising fees on the nurses who never leave Bliss.';
      return `<div class="reference-box"><strong>${escapeHtml(marker)}</strong>${escapeHtml(objection)}</div>`;
    }

    function helperFor(lines) {
      const text = directive(lines, 'Helper text');
      return text ? `<p class="helper">${inlineMd(text)}</p>` : '';
    }

    function runnerUpReference(screen, index) {
      if (screen.slug !== 'step-five-continued-defend-it' || index !== 0) return '';
      return `<div class="reference-box runner-up-box"><strong>Runner-up options from Step 5</strong><ul>
        <li><strong>Require the board to decide endorsement applications within 30 days and cap the fee</strong> — use this runner-up for the shared practice response below.</li>
        <li>Create a telehealth registration for nurses licensed elsewhere.</li>
        <li>Leave the current requirements in place.</li>
      </ul></div>`;
    }

    function renderChoice(screen, question, index, locked) {
      const id = qid(screen, index);
      const items = parseItems(question.lines, 'choice');
      const selected = answer(id).selected;
      const hasKey = items.some(item => item.strongest);
      const options = items.map((item, itemIndex) => {
        const active = selected === itemIndex;
        const tag = item.strongest ? '<span class="feedback-tag strongest">Strongest choice</span>' : (hasKey ? '<span class="feedback-tag">Consider this</span>' : '<span class="feedback-tag">Your choice</span>');
        return `<div class="option-card${active ? ' selected' : ''}">
          <label class="option-choice"><input type="radio" name="${id}" value="${itemIndex}" data-choice="${id}" ${active ? 'checked' : ''} ${locked ? 'disabled' : ''}><span>${inlineMd(item.label)}</span></label>
          ${active ? `<div class="option-feedback">${tag}${mdBlocks(item.feedback)}</div>` : ''}
        </div>`;
      }).join('');
      return `${recallFor(question.lines)}${referenceFor(screen, index, question.lines)}${helperFor(question.lines)}<div class="options">${options}</div>`;
    }

    function renderWrite(screen, question, index, locked) {
      const id = qid(screen, index);
      const value = answer(id).text || answer(FINAL_VERSION_SOURCES[id]).text || '';
      const placeholder = directive(question.lines, 'Placeholder text in box') || '';
      const label = directive(question.lines, 'Button') || 'Save my response and continue';
      const after = directive(question.lines, 'After they submit');
      return `${referenceFor(screen, index, question.lines)}${runnerUpReference(screen, index)}${helperFor(question.lines)}
        <textarea aria-label="${escapeHtml(question.title)}" data-text="${id}" placeholder="${escapeHtml(placeholder)}" ${locked ? 'disabled' : ''}>${escapeHtml(value)}</textarea>
        <div class="actions"><button class="button" data-save-write="${id}" ${locked || !value.trim() ? 'disabled' : ''}>${escapeHtml(label)}</button></div>
        ${isDone(id) ? `<div class="saved-box"><strong>Your response is saved.</strong>${after ? `<br>${inlineMd(after.replace(/^Your [^.]+\.\s*/, ''))}` : ''}</div>` : ''}`;
    }

    function renderSelfcheck(screen, question, index, locked) {
      const id = qid(screen, index);
      const start = question.lines.findIndex(line => line.trim() === '*Checkboxes:*');
      const checks = [];
      if (start >= 0) {
        for (let i = start + 1; i < question.lines.length; i++) {
          const match = question.lines[i].trim().match(/^-\s+(.+)/);
          if (match) checks.push(match[1]);
          else if (checks.length && question.lines[i].trim()) break;
        }
      }
      const chosen = answer(id).checks || [];
      const rows = checks.map((label, itemIndex) => `<label class="check-row"><input type="checkbox" data-check="${id}" value="${itemIndex}" ${chosen.includes(itemIndex) ? 'checked' : ''} ${locked ? 'disabled' : ''}><span>${inlineMd(label)}</span></label>`).join('');
      const count = chosen.length;
      const outcomeLabel = count === 0 ? 'If they check 0' : count === 1 ? 'If they check 1' : count === 2 ? 'If they check 2' : 'If they check 3';
      const outcome = directive(question.lines, outcomeLabel);
      const thenText = directive(question.lines, 'Then');
      return `${referenceFor(screen, index, question.lines)}${helperFor(question.lines)}<div class="check-list">${rows}</div><button class="button" data-check-button="${id}" ${locked ? 'disabled' : ''}>${escapeHtml(directive(question.lines, 'Button') || 'Check my response')}</button>
        ${isDone(id) ? `<div class="result-box">${inlineMd(outcome)}${thenText ? `<p>${inlineMd(thenText)}</p>` : ''}</div>` : ''}`;
    }

    function renderMulti(screen, question, index, locked) {
      const id = qid(screen, index);
      const items = parseItems(question.lines, 'multi');
      const chosen = answer(id).selectedItems || [];
      const rows = items.map((item, itemIndex) => {
        const checked = chosen.includes(itemIndex);
        const correct = checked === item.belongs;
        return `<div class="option-card${checked ? ' selected' : ''}"><label class="option-choice"><input type="checkbox" data-multi="${id}" value="${itemIndex}" ${checked ? 'checked' : ''} ${locked ? 'disabled' : ''}><span>${inlineMd(item.label)}</span></label>
          ${isDone(id) ? `<div class="option-feedback"><span class="feedback-tag ${correct ? 'match' : 'review'}">${correct ? 'Matches the option list' : 'Review this one'}</span>${mdBlocks(item.feedback)}</div>` : ''}</div>`;
      }).join('');
      return `${helperFor(question.lines)}<div class="options">${rows}</div><div class="actions"><button class="button" data-multi-button="${id}" ${locked ? 'disabled' : ''}>${escapeHtml(directive(question.lines, 'Button') || 'Check my list')}</button></div>`;
    }

    function renderSort(screen, question, index, locked) {
      const id = qid(screen, index);
      const items = parseItems(question.lines, 'sort');
      const assignments = answer(id).assignments || {};
      const cards = items.map((item, itemIndex) => {
        const selected = assignments[itemIndex] || '';
        const correct = selected === item.correct;
        return `<div class="sort-card"><label for="${id}-${itemIndex}">${inlineMd(item.label)}</label><select id="${id}-${itemIndex}" data-sort="${id}" data-item="${itemIndex}" ${locked ? 'disabled' : ''}>
          <option value="">Choose a category</option>${CATEGORIES.map(category => `<option value="${escapeHtml(category)}" ${selected === category ? 'selected' : ''}>${escapeHtml(category)}</option>`).join('')}
        </select>${isDone(id) ? `<div class="option-feedback"><span class="feedback-tag ${correct ? 'match' : 'review'}">${correct ? 'Matches' : `Best fit: ${escapeHtml(item.correct)}`}</span>${mdBlocks(item.feedback)}</div>` : ''}</div>`;
      }).join('');
      const allAssigned = items.length && items.every((_, i) => assignments[i]);
      return `${helperFor(question.lines)}<div class="sort-list">${cards}</div><div class="actions"><button class="button" data-sort-button="${id}" ${locked || !allAssigned ? 'disabled' : ''}>${escapeHtml(directive(question.lines, 'Button') || 'Check my choices')}</button></div>`;
    }

    function renderQuestion(screen, question, index, locked) {
      const id = qid(screen, index);
      let controls = '';
      if (question.type === 'choice') controls = renderChoice(screen, question, index, locked);
      if (question.type === 'write') controls = renderWrite(screen, question, index, locked);
      if (question.type === 'selfcheck') controls = renderSelfcheck(screen, question, index, locked);
      if (question.type === 'multi') controls = renderMulti(screen, question, index, locked);
      if (question.type === 'sort') controls = renderSort(screen, question, index, locked);
      return `<section class="question${locked ? ' locked' : ''}" id="${id}"><p class="question-number">Question ${question.number}</p><h3>${inlineMd(question.title)}</h3>${locked ? '<p class="locked-note">Complete the question above to continue.</p>' : controls}${isDone(id) ? mdBlocks(tailLines(question.lines)) : ''}</section>`;
    }

    function cleanPreface(lines) {
      const start = lines.findIndex(line => line.trim() === '*Why this step matters:*');
      if (start < 0) return lines;
      let end = start + 1;
      while (end < lines.length && (lines[end].trim() || end === start + 1)) end++;
      return lines.slice(end);
    }

    function renderScenario() {
      const about = [];
      const situation = [];
      let target = about;
      for (const raw of scenario?.lines || []) {
        const line = raw.trim();
        if (!line || line === '**About the State of Bliss**') continue;
        if (line.startsWith('**About the State of Bliss**')) {
          target = about;
          const remainder = line.replace('**About the State of Bliss**', '').trim();
          if (remainder) target.push(remainder);
          continue;
        }
        if (line.startsWith('**The situation in Bliss**')) {
          target = situation;
          const remainder = line.replace('**The situation in Bliss**', '').trim();
          if (remainder) target.push(remainder);
          continue;
        }
        target.push(raw);
      }
      return `<details class="scenario-card" open><summary>Review the Scenario</summary><div class="scenario-body"><h3>About the State of Bliss</h3>${mdBlocks(about)}<h3>The Situation in Bliss</h3>${mdBlocks(situation)}</div></details>`;
    }

    function openingScreen() {
      progressFill.style.width = '0%';
      app.innerHTML = `<section class="screen page-card">
        <div class="page-banner"><p class="eyebrow">Interactive practice activity</p><h1>Build a policy brief, one decision at a time</h1><p class="lede">Practice the six steps with a fictional policy issue, then apply the same thinking to your own brief.</p></div>
        <div class="opening-body">
          <section class="name-card"><label for="student-name">Student name <span>Required</span></label><input id="student-name" type="text" autocomplete="name" value="${escapeHtml(state.studentName || '')}" placeholder="First and last name" required><p>Your name will appear on the summary sheet you submit for grading.</p></section>
          <div class="at-glance" aria-label="Activity at a glance">
            <div class="glance-item"><strong>What</strong>Complete an interactive practice activity using the State of Bliss scenario.</div>
            <div class="glance-item"><strong>When</strong>Complete it before you develop your policy brief. Due dates are in Canvas.</div>
            <div class="glance-item"><strong>What you submit</strong>Save the final summary as a PDF and attach it as an appendix to your policy brief.</div>
          </div>

          <div class="notice"><h3>Before you start</h3><p>Your name, responses, and current place in the activity save automatically on this device. To return later, use this same browser and the same activity link.</p><p>Browser settings can still remove saved work if you use a private or incognito window or clear your browsing data. Complete the activity in one sitting if you can.</p><p><strong>When you reach the end, print or save your summary sheet as a PDF right away.</strong></p></div>

          <section class="content-section"><h3>What you will do</h3><p>You will work through six steps involved in developing a policy brief. Throughout the activity, you will use one example so you can focus on the process.</p><p>Sometimes you will write a short response. Other times you will choose between several options, place information into categories, or compare different approaches. After each choice, you will see an explanation of why an option is stronger or weaker.</p><p>The example focuses on the Nurse Licensure Compact. The policy issue is real, but the activity takes place in a fictional state called Bliss. You will learn more about Bliss in Step One.</p><p>This is a <strong>practice activity</strong>. After completing it, you will use the same six steps to develop a policy brief on the topic you have already selected.</p></section>

          <section class="content-section"><h3>Where you complete and submit your work</h3><p>Complete the activity here. Nothing is sent or submitted from this webpage. At the end, your responses will be collected automatically into a summary sheet.</p><p><strong>What you will submit:</strong> Save your completed summary sheet as a PDF. Submit that PDF as an appendix with your policy brief in Canvas.</p><p>This activity is graded for <strong>completion</strong>, not for choosing the strongest answer every time. Answer based on what you think. If you choose an option that turns out not to be the strongest choice, that is part of the learning process.</p></section>

          <section class="content-section"><h3>What a policy brief is</h3><p>A policy brief is a concise document written for a specific person who has the authority or influence to act on an issue. Nurses may use a policy brief to make a case to a legislator, board member, organizational leader, or another decision-maker.</p><p>A policy brief:</p><ul><li>identifies the problem and who it affects</li><li>presents realistic options, including leaving things as they are</li><li>recommends one option and explains why</li><li>asks the reader to take a specific action</li></ul><p>The <a href="https://writingcenter.unc.edu/tips-and-tools/policy-briefs/" target="_blank" rel="noopener">UNC Chapel Hill Writing Center policy brief guide<span class="print-hide"> ↗</span></a> is worth reading before you draft your own brief. The specific length, format, and grading requirements for <strong>your policy brief</strong> are in Canvas.</p></section>

          <section class="content-section"><h3>Why this matters</h3><p>You may never testify at a statehouse or send a policy brief to an elected official. However, nurses advocate for change in many settings. You may ask a manager to change a protocol, bring a staffing concern to a unit council, propose a change through shared governance, or ask a professional organization to take a position.</p><p>The setting may change, but the same skills apply: identify who can make the change, state the problem clearly, take opposing concerns seriously, and ask for a specific action.</p></section>

          <section class="content-section"><h3>The six steps</h3><ol class="six-steps"><li>State the problem.</li><li>Figure out who has the power to change it.</li><li>Map who is affected and who may object.</li><li>Lay out the realistic options, including doing nothing.</li><li>Choose one option and defend your choice.</li><li>Make a specific ask and explain how you would know whether it worked.</li></ol><p><strong>Read the explanation after every choice, even when you select the strongest answer.</strong> The explanations are where much of the learning happens.</p></section>

          <div class="actions"><button class="button orange" id="begin" ${state.studentName?.trim() ? '' : 'disabled'}>Begin Step 1</button></div>
        </div>
      </section>`;
      const nameInput = document.getElementById('student-name');
      nameInput.addEventListener('input', event => {

    function stepScreen(index) {
      const screen = screens[index - 1];
      const questions = screen.parsed.questions;
      progressFill.style.width = `${(screen.step / 6) * 100}%`;
      let priorDone = true;
      const questionHtml = questions.map((question, qIndex) => {
        const locked = !priorDone;
        const html = renderQuestion(screen, question, qIndex, locked);
        priorDone = priorDone && isDone(qid(screen, qIndex));
        return html;
      }).join('');
      const allDone = questions.every((_, qIndex) => isDone(qid(screen, qIndex)));
      const why = whyText(screen.parsed.preface);
      const nextLabel = index === screens.length ? 'View my summary sheet' : `Continue to ${screens[index].title.replace(/^Step /, 'Step ')}`;
      app.innerHTML = `<section class="screen">
        <div class="workspace">
          <article class="lesson-card"><div class="lesson-head"><p class="eyebrow" style="color:var(--orange)">Step ${screen.step} of 6${/continued/i.test(screen.title) ? ' · Part 2' : ''}</p><h2>${inlineMd(screen.title.replace(/^Step [^:]+:\s*/i, ''))}</h2>${why ? `<div class="why"><strong>Why this step matters</strong>${inlineMd(why)}</div>` : ''}</div>
          <div class="lesson-body">${mdBlocks(cleanPreface(screen.parsed.preface))}${questionHtml}</div></article>
          ${renderScenario()}
        </div>
        <nav class="screen-nav" aria-label="Activity navigation"><button class="button secondary" data-back>Back</button><button class="button orange" data-next ${allDone ? '' : 'disabled'}>${escapeHtml(nextLabel)}</button></nav>
        ${allDone ? '' : '<p class="completion-hint">Complete each question on this screen to continue.</p>'}
      </section>`;
      bindStepEvents(screen, questions, index);
    }

    function bindStepEvents(screen, questions, screenIndex) {
      document.querySelector('[data-back]').addEventListener('click', () => go(screenIndex - 1));
      const next = document.querySelector('[data-next]');
      if (!next.disabled) next.addEventListener('click', () => go(screenIndex + 1));

      document.querySelectorAll('[data-text]').forEach(area => area.addEventListener('input', event => {
        const id = event.target.dataset.text;
        state.answers[id] = { ...answer(id), text: event.target.value };
        persist('Saving…');
        const button = document.querySelector(`[data-save-write="${id}"]`);
        if (button) button.disabled = !event.target.value.trim();
      }));
      document.querySelectorAll('[data-save-write]').forEach(button => button.addEventListener('click', event => {
        const id = event.currentTarget.dataset.saveWrite;
        const area = document.querySelector(`[data-text="${id}"]`);
        const value = area?.value || answer(id).text || '';
        if (!value.trim()) return;
        state.answers[id] = { ...answer(id), text: value };
        state.completed[id] = true; persist(); renderAt(id);
      }));
      document.querySelectorAll('[data-choice]').forEach(input => input.addEventListener('change', event => {
        const id = event.target.dataset.choice;
        state.answers[id] = { ...answer(id), selected: Number(event.target.value) };
        state.completed[id] = true; persist(); renderAt(id);
      }));
      document.querySelectorAll('[data-check]').forEach(input => input.addEventListener('change', event => {
        const id = event.target.dataset.check;
        const set = new Set(answer(id).checks || []);
        event.target.checked ? set.add(Number(event.target.value)) : set.delete(Number(event.target.value));
        state.answers[id] = { ...answer(id), checks: [...set].sort() }; persist('Saving…');
      }));
      document.querySelectorAll('[data-check-button]').forEach(button => button.addEventListener('click', event => {
        const id = event.currentTarget.dataset.checkButton; state.completed[id] = true; persist(); renderAt(id);
      }));
      document.querySelectorAll('[data-multi]').forEach(input => input.addEventListener('change', event => {
        const id = event.target.dataset.multi;
        const set = new Set(answer(id).selectedItems || []);
        event.target.checked ? set.add(Number(event.target.value)) : set.delete(Number(event.target.value));
        state.answers[id] = { ...answer(id), selectedItems: [...set].sort() }; persist('Saving…');
      }));
      document.querySelectorAll('[data-multi-button]').forEach(button => button.addEventListener('click', event => {
        const id = event.currentTarget.dataset.multiButton; state.completed[id] = true; persist(); renderAt(id);
      }));
      document.querySelectorAll('[data-sort]').forEach(select => select.addEventListener('change', event => {
        const id = event.target.dataset.sort;
        const assignments = { ...(answer(id).assignments || {}), [event.target.dataset.item]: event.target.value };
        state.answers[id] = { ...answer(id), assignments }; persist('Saving…'); renderAt(id, false);
      }));
      document.querySelectorAll('[data-sort-button]').forEach(button => button.addEventListener('click', event => {
        const id = event.currentTarget.dataset.sortButton; state.completed[id] = true; persist(); renderAt(id);
      }));
      function renderAt(id, shouldFocus = true) {
        stepScreen(screenIndex);
        if (shouldFocus) requestAnimationFrame(() => document.getElementById(id)?.scrollIntoView({ block: 'start' }));
      }
    }

    const summaryItems = [
      { title:'Step one: state the problem', subtitle:'Who is affected, by what, and at what scale', principle:'Name who is affected, what is causing it, and how big it is. Keep the solution out of the problem sentence.', ids:['step-one-state-the-problem-q1','step-one-state-the-problem-q2','step-one-state-the-problem-q3','step-one-state-the-problem-q4'] },
      { title:'Step one, continued: back it with evidence', subtitle:'Different sources do different jobs', principle:'Data from the agency that runs a process is the hardest evidence for a reader to dismiss. Stories help a reader understand the human side and opinion polls show whether a change can move. Neither one establishes that a problem exists.', ids:['step-one-continued-back-it-with-evidence-q1'] },
      { title:'Step two: figure out who has the power to change it', subtitle:'What controls the problem', principle:'Work out what controls the problem before you decide who to write to. Licensure and scope of practice are state matters, and a brief aimed at the wrong level cannot work however well it is written.', ids:['step-two-figure-out-who-has-the-power-to-change-it-q1'] },
      { title:'Step two, continued: name the person', subtitle:'Authority is not the same as influence', principle:'Write to the person who controls the step your issue is stuck at. You can write to an ally instead, as long as your ask matches what that ally can deliver.', ids:['step-two-figure-out-who-has-the-power-to-change-it-q2'] },
      { title:'Step three: map who is affected', subtitle:'Supporters, resisters, and the people nobody asked', principle:'Identify who would support, who would resist, and who is affected but absent. Check your assumptions about the first two, and look hardest at the third.', ids:['step-three-map-who-is-affected-q1'] },
      { title:'Step three, continued: take the objection seriously', subtitle:'Concede what is real, then give your reader something to do', principle:'Find out whether an objection is wrong, half right, or sound before you answer it. Concede what is real, add what complicates it, and give your reader something specific to do.', ids:['step-three-continued-take-the-objection-seriously-q1','step-three-continued-take-the-objection-seriously-q2','step-three-continued-take-the-objection-seriously-q3','step-three-continued-take-the-objection-seriously-q4'] },
      { title:'Step four: build the option set', subtitle:'What belongs on the list and what does not', principle:'An option belongs if your reader could actually choose it. Include the status quo every time, include the narrower fixes, and leave off anything that exists only to lose.', ids:['step-four-build-the-option-set-q1'] },
      { title:'Step four, continued: weigh the options against the problem', subtitle:'What each option fixes, and what doing nothing costs', principle:'Compare each option against the problem piece by piece, and name what your own recommendation leaves unfixed. A reader who sees you state your option\'s limits will believe you about the others.', ids:['step-four-continued-weigh-the-options-against-the-problem-q1','step-four-continued-weigh-the-options-against-the-problem-q2','step-four-continued-weigh-the-options-against-the-problem-q3','step-four-continued-weigh-the-options-against-the-problem-q4'] },
      { title:'Step five: commit', subtitle:'What you would recommend, and what defending it requires', principle:'A brief has to recommend something. Choose the one you can defend honestly, knowing what it costs and what it leaves undone.', ids:['step-five-commit-q1','step-five-commit-q2'] },
      { title:'Step five, continued: defend it', subtitle:'Name the runner-up before your reader does', principle:'Name the runner-up, say what it would accomplish, then say what it leaves undone and what your recommendation costs to reach further. A defense that concedes nothing persuades no one.', ids:['step-five-continued-defend-it-q1','step-five-continued-defend-it-q2','step-five-continued-defend-it-q3'] },
      { title:'Step six: make the ask', subtitle:'One action, aimed at your reader, at the right stage', principle:'End with one action, aimed at the person holding the brief, at the stage your issue is actually in, with a date attached and something offered in return.', ids:['step-six-make-the-ask-q1'] },
      { title:'Step six, continued: say how you would know it worked', subtitle:'A baseline, a date, and a result that could go against you', principle:'Tie your measure to the problem you named at the start, give it a baseline and a date, and make sure it could come back against you.', ids:['step-six-continued-say-how-you-would-know-it-worked-q1','step-six-continued-say-how-you-would-know-it-worked-q2','step-six-continued-say-how-you-would-know-it-worked-q3'] }
    ];

    function questionById(id) {
      for (const screen of screens) {
        const index = screen.parsed.questions.findIndex((_, qIndex) => qid(screen, qIndex) === id);
        if (index >= 0) return { screen, question: screen.parsed.questions[index], index };
      }
      return null;
    }

    function summaryWork(id) {
      const found = questionById(id);
      if (!found) return [];
      const { question } = found;
      const data = answer(id);
      const output = [];
      if (question.type === 'write') {
        let label = 'Your response';
        if (id === 'step-one-state-the-problem-q1') label = 'Your original problem statement';
        if (id === 'step-one-state-the-problem-q4') label = 'Your revised problem statement';
        if (id === 'step-five-commit-q2') label = 'What defending your recommendation would require';
        if (FINAL_VERSION_SOURCES[id]) label = 'Your final version';
        output.push([label, data.text || 'No response entered']);
      }
      if (question.type === 'choice') {
        const items = parseItems(question.lines, 'choice');
        output.push(['Your choice', Number.isInteger(data.selected) ? items[data.selected]?.label : 'No choice recorded']);
      }
      if (question.type === 'selfcheck') {
        const labels = [];
        const start = question.lines.findIndex(line => line.trim() === '*Checkboxes:*');
        for (let i = start + 1; i < question.lines.length; i++) {
          const line = question.lines[i]?.trim() || '';
          if (!line && !labels.length) continue;
          const match = line.match(/^-\s+(.+)/);
          if (!match) { if (labels.length) break; else continue; }
          labels.push(match[1]);
        }
        output.push(['Your self-check', (data.checks || []).map(i => labels[i]).join('; ') || 'None checked']);
      }
      if (question.type === 'sort') {
        const items = parseItems(question.lines, 'sort');
        output.push(['Your categories', items.map((item, i) => `${item.label} — ${(data.assignments || {})[i] || 'No category chosen'}`).join('\n')]);
      }
      if (question.type === 'multi') {
        const items = parseItems(question.lines, 'multi');
        output.push(['Items you selected', (data.selectedItems || []).map(i => items[i]?.label).filter(Boolean).join('\n') || 'None selected']);
      }
      return output;
    }

    function summaryScreen() {
      progressFill.style.width = '100%';
      const cards = summaryItems.map(item => {
        const work = item.ids.flatMap(summaryWork);
        return `<section class="summary-step"><h3>${escapeHtml(item.title)}</h3><p class="summary-subtitle">${escapeHtml(item.subtitle)}</p><dl class="student-work">${work.map(([label, value]) => `<dt>${escapeHtml(label)}</dt><dd>${escapeHtml(value || '')}</dd>`).join('')}</dl><p class="principle"><strong>Principle:</strong> ${escapeHtml(item.principle)}</p></section>`;
      }).join('');
      const completedDate = new Date(state.completedAt || Date.now()).toLocaleDateString([], { year: 'numeric', month: 'long', day: 'numeric' });
      app.innerHTML = `<section class="screen page-card"><div class="page-banner"><p class="eyebrow">Completed activity</p><h1>Policy brief activity: summary sheet</h1><p class="lede">Your responses and the principle from each step are collected below.</p></div><div class="summary-page">
        <div class="summary-toolbar"><div><strong>Print this now.</strong><br><span>Choose Save as PDF in your browser's print window.</span></div><button class="button orange" id="print-summary">Print or save as PDF</button></div>
        <div class="summary-identity"><div><span>Student name</span><strong>${escapeHtml(state.studentName || 'Name not entered')}</strong></div><div><span>Activity completed</span><strong>${escapeHtml(completedDate)}</strong></div></div>
        ${cards}
        <section class="final-word"><h3>A last word</h3><p>This activity used a bill in a fictional statehouse because legislation is the clearest version of the process. It has visible stages, a written record, and a person whose job is to decide. It is not the most common version.</p><p>Most of the advocacy you do will be closer than that: a protocol on your unit, a staffing pattern your council could take up, an organizational policy that needs another look, or a position your professional organization could be asked to take. The six steps do not change with the size of the room.</p><p>Nurses are closest to the place where a policy meets a patient. You see the distance between what a policy says and what it does long before many people who write policy will. That knowledge does not travel on its own. Somebody has to carry it into the room where the decision gets made, in a form the person making the decision can use.</p><p><strong>That is what a brief is for, and you now know how to build one. The next one is yours.</strong></p></section>
        <nav class="screen-nav print-hide"><button class="button secondary" data-back>Back to Step 6</button></nav>
      </div></section>`;
      document.getElementById('print-summary').addEventListener('click', () => window.print());
      document.querySelector('[data-back]').addEventListener('click', () => go(screens.length));
    }

    function go(screen) {
      state.screen = Math.max(0, Math.min(screen, screens.length + 1));
      if (state.screen === screens.length + 1 && !state.completedAt) state.completedAt = Date.now();
      persist(); render(); window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function registerWebMcp() {
      const context = document.modelContext;
      if (!context?.registerTool) return;
      const completedCount = () => Object.values(state.completed).filter(Boolean).length;
      try {
        void Promise.resolve(context.registerTool({
          name: 'read_activity_progress',
          title: 'Read activity progress',
          description: 'Read the learner’s current location and number of completed questions without changing the activity.',
          inputSchema: { type: 'object', properties: {}, additionalProperties: false },
          annotations: { readOnlyHint: true, untrustedContentHint: false },
          execute() {
            return { currentScreen: state.screen, totalScreens: screens.length + 2, completedQuestions: completedCount(), totalQuestions: totalQuestionCount };
          }
        })).catch(() => {});
        void Promise.resolve(context.registerTool({
          name: 'navigate_activity',
          title: 'Navigate the activity',
          description: 'Open a numbered activity screen. Screen 0 is the introduction and the final screen is the summary.',
          inputSchema: {
            type: 'object',
            properties: { screen: { type: 'integer', minimum: 0, maximum: 12 } },
            required: ['screen'],
            additionalProperties: false
          },
          annotations: { readOnlyHint: false, untrustedContentHint: false },
          execute(input) {
            if (!Number.isInteger(input?.screen) || input.screen < 0 || input.screen > screens.length + 1) throw new Error('Screen must be an integer from 0 through 12.');
            let highestUnlocked = 1;
            for (let index = 0; index < screens.length; index++) {
              const screen = screens[index];
              const complete = screen.parsed.questions.every((_, questionIndex) => isDone(qid(screen, questionIndex)));
              if (!complete) break;
              highestUnlocked = index + 2;
            }
            if (input.screen > highestUnlocked) throw new Error('Complete the earlier questions before opening that screen.');
            go(input.screen);
            return { currentScreen: state.screen };
          }
        })).catch(() => {});
      } catch { /* WebMCP is optional in browsers that do not support it. */ }
    }

    function render() {
      if (state.screen === 0) openingScreen();
      else if (state.screen <= screens.length) stepScreen(state.screen);
      else summaryScreen();
    }

    async function restoreAndStart() {
      try {
        const indexed = await readIndexedState();
        if (indexed && Number(indexed.savedAt || 0) > Number(state.savedAt || 0)) Object.assign(state, indexed);
      } catch { /* Local storage may still contain the saved work. */ }
      let updated = false;
      const priorProblemRevision = answer('step-one-state-the-problem-q3').optional?.trim();
      if (priorProblemRevision && !answer('step-one-state-the-problem-q4').text?.trim()) {
        state.answers['step-one-state-the-problem-q4'] = { text: priorProblemRevision };
        state.completed['step-one-state-the-problem-q4'] = true;
        updated = true;
      }
      if (Object.prototype.hasOwnProperty.call(answer('step-one-state-the-problem-q3'), 'optional')) {
        delete state.answers['step-one-state-the-problem-q3'].optional;
        updated = true;
      }
      const priorDefense = answer('step-five-commit-q1').optional?.trim();
      if (priorDefense && !answer('step-five-commit-q2').text?.trim()) {
        state.answers['step-five-commit-q2'] = { text: priorDefense };
        state.completed['step-five-commit-q2'] = true;
        updated = true;
      }
      if (Object.prototype.hasOwnProperty.call(answer('step-five-commit-q1'), 'optional')) {
        delete state.answers['step-five-commit-q1'].optional;
        updated = true;
      }
      const finalVersionMigrations = [
        ['step-three-continued-take-the-objection-seriously-q3', 'step-three-continued-take-the-objection-seriously-q4'],
        ['step-four-continued-weigh-the-options-against-the-problem-q3', 'step-four-continued-weigh-the-options-against-the-problem-q4'],
        ['step-five-continued-defend-it-q2', 'step-five-continued-defend-it-q3'],
        ['step-six-continued-say-how-you-would-know-it-worked-q2', 'step-six-continued-say-how-you-would-know-it-worked-q3']
      ];
      for (const [fromId, toId] of finalVersionMigrations) {
        const priorFinalVersion = answer(fromId).optional?.trim();
        if (priorFinalVersion && !answer(toId).text?.trim()) {
          state.answers[toId] = { text: priorFinalVersion };
          state.completed[toId] = true;
          updated = true;
        }
        if (Object.prototype.hasOwnProperty.call(answer(fromId), 'optional')) {
          delete state.answers[fromId].optional;
          updated = true;
        }
      }
      if (!state.studentName?.trim()) state.screen = 0;
      else {
        const firstIncomplete = screens.findIndex(screen => screen.parsed.questions.some((_, questionIndex) => !isDone(qid(screen, questionIndex))));
        const highestUnlocked = firstIncomplete < 0 ? screens.length + 1 : firstIncomplete + 1;
        if (state.screen > highestUnlocked) { state.screen = highestUnlocked; updated = true; }
      }
      if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
      if (updated) persist();
      render();
      registerWebMcp();
      saveStatus.textContent = savedStatus();
    }

    function saveBeforeLeaving() {
      state.savedAt = Date.now();
      const snapshot = JSON.parse(JSON.stringify(state));
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot)); } catch { /* IndexedDB remains available in most browsers. */ }
      writeIndexedState(snapshot).catch(() => {});
    }

    async function startOver() {
      window.clearTimeout(persist.indexedTimer);
      try { localStorage.removeItem(STORAGE_KEY); } catch { /* Continue with the second device save. */ }
      try { await clearIndexedState(); } catch { /* The in-memory activity will still reset. */ }
      Object.assign(state, { screen: 0, studentName: '', answers: {}, completed: {}, completedAt: 0, savedAt: 0 });
      render();
      saveStatus.textContent = 'Ready for a fresh start';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.addEventListener('pagehide', saveBeforeLeaving);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveBeforeLeaving(); });
    document.getElementById('start-over').addEventListener('click', () => {
      if (typeof restartDialog.showModal === 'function') restartDialog.showModal();
      else if (window.confirm('Erase the student name and every saved response and start over?')) startOver();
    });
    document.getElementById('cancel-restart').addEventListener('click', () => restartDialog.close());
    document.getElementById('confirm-restart').addEventListener('click', () => { restartDialog.close(); startOver(); });
    restartDialog.addEventListener('click', event => { if (event.target === restartDialog) restartDialog.close(); });
    restoreAndStart();
  </script>
</body>
</html>
